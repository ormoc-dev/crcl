<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3f2a1a" />
    <meta name="description" content="Choir lyrics viewer with offline access" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CRC" />
    <title>Christus Rex Choir Song Lyrics</title>
    <script>
      // Root on Vercel; /crc/crcl/ on XAMPP localhost
      (function () {
        var path = location.pathname.replace(/\/index\.html$/, '')
        var base =
          path === '/crc/crcl' ||
          path.indexOf('/crc/crcl/') === 0 ||
          path === '/crcl' ||
          path.indexOf('/crcl/') === 0
            ? path.endsWith('/')
              ? path
              : path + '/'
            : '/'
        var b = document.createElement('base')
        b.href = base
        document.head.prepend(b)
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Libre+Baskerville:wght@400;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="manifest" href="manifest.webmanifest?v=1" />
    <link rel="icon" type="image/png" sizes="192x192" href="public/assets/icon/icon-192.png" />
    <link rel="apple-touch-icon" href="public/assets/icon/icon-192.png" />
    <link rel="stylesheet" href="css/main.css?v=23" />
    <script>
      // Apply saved text size before first paint
      ;(function () {
        try {
          var s = localStorage.getItem('crc-text-scale')
          if (s === '0.9' || s === '1' || s === '1.15' || s === '1.3') {
            document.documentElement.style.setProperty('--text-scale', s)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app">
      <header class="site-header" data-component="header"></header>
      <main class="site-main" id="page-content"></main>
      <nav class="bottom-bar" data-component="bottom-bar" aria-label="Primary"></nav>
    </div>

    <script type="module" src="js/main.js?v=23"></script>
  </body>
</html>
